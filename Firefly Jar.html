<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Jar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--ink:#f1f0e4;--muted:#8d97b5;--panel:#18213a;--bd:#2b3858;--fly:#d8f25a;--bat:#7a5fb0;--accent:#ffb347;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ecf6;--ink:#141a2e;--muted:#56607e;--panel:#ffffff;--bd:#c6cde3}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Mono',ui-monospace,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:clamp(34px,7vw,52px);margin:4px 0 10px}
#wrap{position:relative;width:100%;max-width:520px}
canvas{display:block;width:100%;height:auto;border-radius:14px;border:3px solid var(--bd);background:#0b1020;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,26,.82);border-radius:14px;padding:12px;overflow:auto}
#overlay.hide{display:none}
.panel{background:var(--panel);color:var(--ink);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;width:min(100%,400px);text-align:center}
.panel h2{font-family:'Fredoka',system-ui,sans-serif;font-size:32px;margin:0 0 4px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:13px}
.lbl{font-size:12px;color:var(--muted);margin:10px 0 6px}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:2px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--fly)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.on{background:var(--fly);border-color:var(--fly);color:#1b2108;font-weight:500}
button.go{background:var(--accent);border-color:var(--accent);color:#2a1800;font-weight:500;margin-top:16px;padding:10px 28px;font-size:16px}
button.quit{margin-top:10px;font-size:12px;color:var(--muted)}
.score-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;margin-top:10px;font-family:'Fredoka',system-ui,sans-serif;font-weight:500;font-size:clamp(18px,4.5vw,24px)}
.score-bar small{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.info{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<h1>Firefly Jar</h1>
<div id="wrap">
  <canvas id="c" width="520" height="640" aria-label="Firefly catching game"></canvas>
  <div id="overlay">
    <div class="panel">
      <h2 id="ovTitle">Firefly Jar</h2>
      <p id="ovMsg">Catch fireflies in your jar. Dodge the bats.</p>
      <div class="lbl">Difficulty</div><div class="row" id="diffRow"></div>
      <div class="lbl">Fireflies to catch</div><div class="row" id="goalRow"></div>
      <button class="go" id="startBtn">Start game</button><br>
      <button class="quit" id="exitBtn">Exit</button>
    </div>
  </div>
</div>
<div class="score-bar"><span id="sC">Caught 0</span><small id="sMid"></small><span id="sL">Lives 3</span></div>
<div class="info">Move the jar with ← / → or A / D, or drag. Space pauses.</div>

<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=520,H=640;
var DIFF={
  Easy:{fall:.7,jar:1.5,bat:.15},
  Medium:{fall:1,jar:1,bat:.25},
  Hard:{fall:1.4,jar:.75,bat:.4}
};
var cfg={diff:'Medium',goal:20};
var st='menu',paused=false,keys={},J,items,parts,caught,lives,t,spawnT,stars=[],flash=0;
var JH=54,JBASE=84,JSPEED=7.5;
for(var i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3});

function mk(id,vals,key){
  var el=document.getElementById(id);
  vals.forEach(function(v){var b=document.createElement('button');b.textContent=v;b.dataset.v=v;
    b.onclick=function(){cfg[key]=(key==='goal')?+v:v;sync();};el.appendChild(b);});
}
mk('diffRow',['Easy','Medium','Hard'],'diff');
mk('goalRow',[10,20,30,50],'goal');
function sync(){
  [].forEach.call(document.querySelectorAll('#diffRow button,#goalRow button'),function(b){
    b.classList.toggle('on',b.dataset.v==cfg.diff||b.dataset.v==cfg.goal);});
  document.getElementById('sMid').textContent=cfg.diff+' · goal '+cfg.goal;
}
function ui(){
  document.getElementById('sC').textContent='Caught '+caught+' / '+cfg.goal;
  document.getElementById('sL').textContent='Lives '+lives;
}
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.06;
  o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.12));
  o.stop(AC.currentTime+(d||.12)+.01);}catch(e){}}
function burst(x,y,n,c){for(var i=0;i<n;i++){var a=Math.random()*6.283,s=1+Math.random()*2.5;
  parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:c});}}

function newGame(){
  var d=DIFF[cfg.diff];
  J={x:W/2,w:JBASE*d.jar};items=[];parts=[];caught=0;lives=3;t=0;spawnT=30;flash=0;ui();
}
function spawn(){
  var d=DIFF[cfg.diff],bat=Math.random()<d.bat,gold=!bat&&Math.random()<.1;
  items.push({k:bat?'bat':(gold?'gold':'fly'),x:30+Math.random()*(W-60),y:-20,
    v:(1.8+Math.random()*1.2)*d.fall*(1+t/6000),ph:Math.random()*6.28,amp:bat?0:18+Math.random()*14,x0:0});
  items[items.length-1].x0=items[items.length-1].x;
}
function end(win){
  st='over';
  document.getElementById('ovTitle').textContent=win?'Jar full!':'Lights out';
  document.getElementById('ovMsg').textContent=(win?'You caught ':'You caught ')+caught+' of '+cfg.goal+' fireflies. Pick settings and play again.';
  document.getElementById('startBtn').textContent='Play again';
  document.getElementById('overlay').classList.remove('hide');
}
function update(){
  var d=DIFF[cfg.diff];t++;
  if(keys.ArrowLeft||keys.a)J.x-=JSPEED;
  if(keys.ArrowRight||keys.d)J.x+=JSPEED;
  J.x=Math.max(J.w/2,Math.min(W-J.w/2,J.x));
  if(--spawnT<=0){spawn();spawnT=Math.max(22,60-t/60)*(0.8+Math.random()*.5)/(d.fall>1?1.15:1);}
  var jy=H-JH-14;
  items.forEach(function(it){
    it.y+=it.v;it.ph+=.05;
    if(it.k!=='bat')it.x=it.x0+Math.sin(it.ph)*it.amp;
    if(!it.dead&&it.y>jy&&it.y<jy+22&&Math.abs(it.x-J.x)<J.w/2){
      it.dead=true;
      if(it.k==='bat'){lives--;flash=1;burst(it.x,it.y,16,'#7a5fb0');beep(150,.25);}
      else{caught+=it.k==='gold'?3:1;burst(it.x,it.y,14,it.k==='gold'?'#ffb347':'#d8f25a');beep(it.k==='gold'?880:620);}
      ui();
    }
    if(it.y>H+30)it.dead=true;
  });
  items=items.filter(function(i){return!i.dead;});
  if(caught>=cfg.goal)end(true);
  else if(lives<=0)end(false);
}
function glow(x,y,r,c){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();}
function draw(){
  ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#cfd6ee';stars.forEach(function(s){ctx.globalAlpha=.4+.3*Math.sin(t/40+s.x);ctx.fillRect(s.x,s.y,s.r,s.r);});
  ctx.globalAlpha=1;
  ctx.fillStyle='#10192e';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H-60);
  for(var x=0;x<=W;x+=40)ctx.lineTo(x,H-60-Math.abs(Math.sin(x*.05))*22);ctx.lineTo(W,H);ctx.fill();
  if(!J)return;
  items.forEach(function(it){
    if(it.k==='bat'){
      var f=Math.sin(it.ph*6)*7;ctx.fillStyle='#7a5fb0';ctx.beginPath();
      ctx.moveTo(it.x,it.y-4);ctx.quadraticCurveTo(it.x-18,it.y-14+f,it.x-26,it.y+4);
      ctx.quadraticCurveTo(it.x-14,it.y+2,it.x-8,it.y+8);ctx.lineTo(it.x,it.y+3);
      ctx.lineTo(it.x+8,it.y+8);ctx.quadraticCurveTo(it.x+14,it.y+2,it.x+26,it.y+4);
      ctx.quadraticCurveTo(it.x+18,it.y-14+f,it.x,it.y-4);ctx.fill();
      ctx.fillStyle='#ff6b6b';ctx.fillRect(it.x-5,it.y-1,2,2);ctx.fillRect(it.x+3,it.y-1,2,2);
    }else{
      var c=it.k==='gold'?'rgba(255,179,71,.9)':'rgba(216,242,90,.9)';
      glow(it.x,it.y,it.k==='gold'?22:16,c);ctx.fillStyle=it.k==='gold'?'#fff1c9':'#f6ffc2';
      ctx.beginPath();ctx.arc(it.x,it.y,3.5,0,6.283);ctx.fill();
    }
  });
  var jy=H-JH-14,jx=J.x-J.w/2;
  ctx.fillStyle='rgba(160,200,230,.16)';ctx.strokeStyle='#a9d4ee';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(jx,jy,J.w,JH,10):ctx.rect(jx,jy,J.w,JH);ctx.fill();ctx.stroke();
  ctx.fillStyle='#8a6a4a';ctx.fillRect(jx+6,jy-8,J.w-12,8);
  if(caught>0)glow(J.x,jy+JH-12,Math.min(J.w*.5,10+caught*1.5),'rgba(216,242,90,.55)');
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.l-=.035;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);});
  parts=parts.filter(function(p){return p.l>0;});ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle='rgba(122,95,176,'+(flash*.35)+')';ctx.fillRect(0,0,W,H);flash-=.05;}
  if(paused){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';
    ctx.font='700 46px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText('Paused',W/2,H/2);}
}
function loop(){if(st==='play'&&!paused)update();draw();requestAnimationFrame(loop);}

document.getElementById('startBtn').onclick=function(){
  newGame();st='play';paused=false;document.getElementById('overlay').classList.add('hide');
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
};
document.getElementById('exitBtn').onclick=function(){
  window.close();
  setTimeout(function(){st='menu';
    document.getElementById('ovTitle').textContent='Thanks for playing';
    document.getElementById('ovMsg').textContent='Your browser blocked closing this tab. You can close it yourself.';},150);
};
window.addEventListener('keydown',function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();}
  keys[k]=true;
  if(e.code==='Space'&&st==='play'){paused=!paused;e.preventDefault();}
});
window.addEventListener('keyup',function(e){keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
function ptr(e){if(st!=='play'||!J)return;var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width);
  J.x=Math.max(J.w/2,Math.min(W-J.w/2,x));}
cv.addEventListener('pointermove',ptr);cv.addEventListener('pointerdown',ptr);
sync();loop();
})();
</script>
</body>
</html>
